name: python3

on: 
  - push

jobs:
  test_lowest_number:
    name: Test Python Script
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Repo check
        run: echo "Repo checked out"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Test Case 1 for ten numbers
        run: |
          python find_lowest_number.py test1_input.txt test1_expected.txt
          diff test1_input.txt test1_expected.txt

      - name: Run Test case 2 for one number
        run: |
          python find_lowest_number.py test2_input.txt test2_expected.txt
          diff test2_input.txt test2_expected.txt

      - name: Run Test case 3 for blank
        run: |
          python find_lowest_number.py test3_input.txt test3_expected.txt
          diff test3_input.txt test3_expected.txt
          
